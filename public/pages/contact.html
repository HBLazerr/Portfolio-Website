<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />

    <title>Daniel Chavez | Contact</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/contact.css" />
  </head>
  <body>
    <!-- Dynamic Navbar Injection -->
    <div id="navbar-placeholder"></div>

    <div class="wrapper">
      <div class="contact-card">
        <h1>CONTACT ME</h1>
        <form
          action="https://formsubmit.co/chavezdanny33@gmail.com"
          method="POST"
        >
          <div class="row">
            <label>Name</label>
            <div class="input-pair">
              <input
                type="text"
                name="first_name"
                placeholder="First Name"
                required
              />
              <input
                type="text"
                name="last_name"
                placeholder="Last Name"
                required
              />
            </div>
          </div>

          <div class="row">
            <label for="email">E-mail <span class="required">*</span></label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="you@email.com"
              required
            />
          </div>

          <div class="row">
            <label for="message">Message</label>
            <textarea
              name="message"
              id="message"
              placeholder="Write your message here..."
              required
            ></textarea>
          </div>

          <!-- hidden config fields -->
          <input
            type="hidden"
            name="_subject"
            value="New Contact Message from Portfolio!"
          />
          <input type="hidden" name="_template" value="box" />
          <input
            type="hidden"
            name="_autoresponse"
            value="Thanks for reaching out! I'll get back to you soon."
          />

          <div class="submit-row">
            <button type="submit">Submit</button>
          </div>
        </form>
      </div>
    </div>

    <div class="inner-cursor"></div>
    <div class="outer-cursor"></div>

    <script type="module">
      import { injectNavbar } from "../js/navbar.js";
      import { initCustomCursor } from "../js/customCursor.js";
      
      initCustomCursor(); // Setup cursor + base hover binding
      injectNavbar(); // Now handles its own hover binding inside
    </script>
  </body>
</html>
